name: Temporary Mixkit metadata map
on:
  push:
    branches: [music-library-bootstrap]
    paths: [".github/workflows/music-library-metadata-map.yml"]
permissions: {contents: read}
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - shell: bash
        run: |
          python3 - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          cats=[('elegant','https://mixkit.co/free-stock-music/mood/elegant/'),('house-fashion','https://mixkit.co/free-stock-music/house/'),('funk-fashion','https://mixkit.co/free-stock-music/funk/'),('edm-fashion','https://mixkit.co/free-stock-music/edm/'),('pop-lifestyle','https://mixkit.co/free-stock-music/pop/'),('ambient','https://mixkit.co/free-stock-music/ambient/'),('jazz','https://mixkit.co/free-stock-music/jazz/'),('lounge','https://mixkit.co/free-stock-music/lounge/'),('calm','https://mixkit.co/free-stock-music/mood/calm/')]
          out={}
          def parse(t):
            ls=[x.strip() for x in t.splitlines() if x.strip() and x.strip()!='Download Free Music']
            for j,x in enumerate(ls):
              if x.lower().startswith('by '): return (ls[j-1] if j else ''),x[3:].strip(),ls
            return '', '', ls
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True); ctx=await b.new_context()
              for bucket,url in cats:
                page=await ctx.new_page(); await page.goto(url,wait_until='domcontentloaded',timeout=60000);await page.wait_for_timeout(1600)
                bs=page.get_by_text('Download Free Music',exact=True); c=await bs.count(); print('CATEGORY',bucket,'BUTTONS',c)
                for i in range(c):
                  x=bs.nth(i); tid=await x.get_attribute('data-algolia-analytics-item-id')
                  text=await x.evaluate('''el=>{let p=el;for(let i=0;i<12&&p;i++,p=p.parentElement){let t=(p.innerText||'').trim();if(t.toLowerCase().includes('by ')&&t.length<2500)return t;}return '';}''')
                  title,artist,ls=parse(text)
                  if tid:
                    if tid not in out: out[tid]={'id':tid,'title':title,'artist':artist,'categories':[],'pages':[],'text':' | '.join(ls[:20])}
                    if bucket not in out[tid]['categories']:out[tid]['categories'].append(bucket)
                    if url not in out[tid]['pages']:out[tid]['pages'].append(url)
                await page.close()
              await b.close()
          asyncio.run(main())
          print('MAPPING_JSON_BEGIN')
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          print('MAPPING_JSON_END')
          print('TOTAL',len(out),'WITH_TITLE',sum(bool(x['title']) for x in out.values()))
          PY
