name: Temporary production analytics dry-run audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-production-analytics-audit.yml"

permissions:
  contents: read
  issues: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser audit dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Run analytics dry-run without transmitting events
        id: audit
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .audit-tmp
          cat > .audit-tmp/analytics-dry-run.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const page = await browser.newPage();
          const attempts = [];
          const scriptResponses = [];
          let failureMessage = '';

          try {
            await page.setRequestInterception(true);
            page.on('request', request => {
              const url = request.url();
              const method = request.method();
              const kind =
                url.includes('googletagmanager.com/gtm.js') ? 'gtm-script' :
                url.includes('connect.facebook.net/en_US/fbevents.js') ? 'meta-script' :
                /google-analytics\.com\/g\/collect|analytics\.google\.com\/g\/collect/.test(url) ? 'ga4-event' :
                /facebook\.com\/tr(?:\?|$)/.test(url) ? 'meta-pixel-event' :
                url === 'https://meta-capi.alhumacollection.workers.dev/events' && method === 'POST' ? 'meta-capi-event' : null;
              if (kind) attempts.push({ kind, method, url });
              if (kind === 'ga4-event' || kind === 'meta-pixel-event' || kind === 'meta-capi-event') request.abort('blockedbyclient');
              else request.continue();
            });
            page.on('response', response => {
              const url = response.url();
              if (url.includes('googletagmanager.com/gtm.js')) scriptResponses.push({ kind:'gtm-script', status:response.status(), url });
              if (url.includes('connect.facebook.net/en_US/fbevents.js')) scriptResponses.push({ kind:'meta-script', status:response.status(), url });
            });

            await page.goto('https://alhumacollection.com/', { waitUntil:'domcontentloaded', timeout:45000 });
            await page.waitForSelector('[data-consent-accept]', { timeout:10000 });
            await page.click('[data-consent-accept]');
            await new Promise(resolve => setTimeout(resolve, 12000));

            const state = await page.evaluate(() => ({
              config: window.AlHumaAnalytics?.config || null,
              consent: window.AlHumaAnalytics?.getConsent?.() || null,
              dataLayerEvents: (window.dataLayer || []).map(entry => Array.isArray(entry) ? entry[0] : entry?.event).filter(Boolean)
            }));

            const required = ['gtm-script','meta-script','ga4-event','meta-pixel-event','meta-capi-event'];
            const found = Object.fromEntries(required.map(kind => [kind, attempts.some(item => item.kind === kind)]));
            const failures = required.filter(kind => !found[kind]);
            if (state.config?.gtmId !== 'GTM-NP995MF2') failures.push('gtm-id');
            if (state.config?.ga4MeasurementId !== 'G-VP0WEM8CNC') failures.push('ga4-id');
            if (state.config?.metaPixelId !== '1738280330535371') failures.push('meta-pixel-id');
            if (state.config?.metaCapiEndpoint !== 'https://meta-capi.alhumacollection.workers.dev/events') failures.push('meta-capi-endpoint');
            if (!state.consent?.analytics || !state.consent?.marketing) failures.push('consent-state');

            const summary = {
              schemaVersion: 1,
              generatedAt: new Date().toISOString(),
              baseUrl: 'https://alhumacollection.com/',
              mode: 'dry-run: event endpoints intercepted and aborted before transmission',
              passed: failures.length === 0,
              failures,
              found,
              attempts,
              scriptResponses,
              state
            };
            await fs.writeFile('/tmp/alhuma-analytics-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
            if (failures.length) failureMessage = `Analytics dry-run failures: ${failures.join(', ')}`;
          } catch (error) {
            failureMessage = error.stack || error.message;
            await fs.writeFile('/tmp/alhuma-analytics-summary.json', `${JSON.stringify({schemaVersion:1,generatedAt:new Date().toISOString(),passed:false,error:failureMessage,attempts,scriptResponses}, null, 2)}\n`);
          } finally {
            await browser.close();
          }
          if (failureMessage) throw new Error(failureMessage);
          NODE
          node .audit-tmp/analytics-dry-run.mjs

      - name: Post audit result to PR 3
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = fs.existsSync('/tmp/alhuma-analytics-summary.json') ? JSON.parse(fs.readFileSync('/tmp/alhuma-analytics-summary.json','utf8')) : {passed:false,error:'Summary file missing'};
          const found = summary.found || {};
          const body = [
            '## Corrected production analytics dry-run',
            '',
            `Workflow step outcome: **${process.env.AUDIT_OUTCOME}**`,
            `Audit passed: **${summary.passed === true}**`,
            '',
            'No production analytics event was transmitted; GA4, Meta Pixel and CAPI event requests were intercepted and aborted after verifying that the live website attempted them.',
            '',
            `- GTM script attempted: ${found['gtm-script'] === true}`,
            `- GA4 event attempted: ${found['ga4-event'] === true}`,
            `- Meta Pixel script attempted: ${found['meta-script'] === true}`,
            `- Meta Pixel event attempted: ${found['meta-pixel-event'] === true}`,
            `- Meta CAPI event attempted: ${found['meta-capi-event'] === true}`,
            `- Failures: ${(summary.failures || []).join(', ') || 'none'}`,
            '',
            '<details><summary>Machine-readable evidence</summary>',
            '',
            '```json',
            JSON.stringify(summary, null, 2).slice(0, 50000),
            '```',
            '</details>'
          ].join('\n');
          fs.writeFileSync('/tmp/alhuma-analytics-comment.md', body);
          NODE
          gh api repos/mfdigisol-creator/mfdigisol-creator.github.io/issues/3/comments -f body="$(cat /tmp/alhuma-analytics-comment.md)"

      - name: Fail when dry-run verification failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
