name: Measure Phase 4A performance staging

on:
  push:
    branches:
      - agent/performance-p1-staging
    paths:
      - ".github/workflows/lighthouse-performance-staging.yml"
      - "scripts/static-audit-server.mjs"
      - "scripts/run-lighthouse-audit.mjs"
      - "index.html"
      - "assistant-runtime.js"
      - "dawood-catalogue.js"
      - "assets/**"
      - "collections/**"
      - "products/**"
      - "shop/**"
      - "404.html"
      - "policies.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4a-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Preserve Stage P1 single-pass baseline
        run: |
          mkdir -p performance
          if test -f performance/lighthouse-summary.json && ! test -f performance/lighthouse-baseline-p1.json; then
            cp performance/lighthouse-summary.json performance/lighthouse-baseline-p1.json
          fi
          if test -f performance/lighthouse-summary.md && ! test -f performance/lighthouse-baseline-p1.md; then
            cp performance/lighthouse-summary.md performance/lighthouse-baseline-p1.md
          fi

      - name: Start local static audit server
        id: server
        run: |
          node scripts/static-audit-server.mjs > /tmp/alhuma-static-server.log 2>&1 &
          echo $! > /tmp/alhuma-static-server.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alhuma-static-server.log
          exit 1

      - name: Verify controlled custom 404 response
        id: custom_404
        run: |
          status="$(curl --silent --output /tmp/alhuma-404.html --write-out '%{http_code}' http://127.0.0.1:4173/phase-4-controlled-invalid-url/)"
          test "$status" = "404"
          grep --quiet "Page not found" /tmp/alhuma-404.html

      - name: Run median mobile and desktop Lighthouse audits
        id: audit
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
          LIGHTHOUSE_PACKAGE: lighthouse@13.3.0
          LIGHTHOUSE_RUNS: 3
          LIGHTHOUSE_REPORT_DIR: /tmp/alhuma-lighthouse-reports
          LIGHTHOUSE_SUMMARY_DIR: performance
        run: |
          set -o pipefail
          node scripts/run-lighthouse-audit.mjs 2>&1 | tee /tmp/alhuma-lighthouse-run.log

      - name: Upload complete Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-lighthouse-reports
          path: /tmp/alhuma-lighthouse-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Persist Lighthouse status and summary
        if: always()
        env:
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CUSTOM_404_OUTCOME: ${{ steps.custom_404.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          mkdir -p performance
          node - <<'NODE'
          const fs = require('node:fs');
          const status = {
            schemaVersion: 2,
            generatedAt: new Date().toISOString(),
            branch: process.env.GITHUB_REF_NAME,
            commit: process.env.GITHUB_SHA,
            serverOutcome: process.env.SERVER_OUTCOME || 'unknown',
            custom404Outcome: process.env.CUSTOM_404_OUTCOME || 'unknown',
            auditOutcome: process.env.AUDIT_OUTCOME || 'unknown',
            repetitionsPerPageProfile: 3,
            aggregation: 'median',
            summaryCreated: fs.existsSync('performance/lighthouse-summary.json')
          };
          fs.writeFileSync('performance/lighthouse-run-status.json', `${JSON.stringify(status, null, 2)}\n`);
          NODE
          if test -f /tmp/alhuma-lighthouse-run.log; then
            tail -n 250 /tmp/alhuma-lighthouse-run.log > performance/lighthouse-run-log.txt
          fi
          if test -z "$(git status --porcelain -- performance/)"; then
            echo "Lighthouse status and summary are already current."
            exit 0
          fi
          git config user.name "Al Huma Performance Staging"
          git config user.email "actions@users.noreply.github.com"
          git add performance/
          git commit -m "Record Phase 4A P2 and P3 Lighthouse medians"
          git push
