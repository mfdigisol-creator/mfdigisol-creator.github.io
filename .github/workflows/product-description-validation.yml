name: Validate product descriptions branch

on:
  push:
    branches:
      - agent/product-descriptions
    paths:
      - ".github/workflows/product-description-validation.yml"
      - "scripts/product-description.mjs"
      - "scripts/test-product-descriptions.mjs"
      - "scripts/sync-dawood.mjs"
      - "scripts/generate-seo-pages-v2.mjs"
      - "scripts/run-functional-smoke.mjs"
      - "dawood-catalogue.js"

permissions:
  contents: read

concurrency:
  group: product-description-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate and validate cached catalogue
        run: |
          node scripts/seo-batch1-postprocess.mjs
          node scripts/generate-seo-pages-v2.mjs
          node scripts/performance-p1-postprocess.mjs
          node scripts/performance-p2p3-postprocess.mjs
          node scripts/version-performance-assets.mjs
          node --check dawood-catalogue.js
          node scripts/test-product-descriptions.mjs
          node scripts/validate-catalogue.mjs
          node scripts/validate-merchant-policy.mjs

      - name: Start local static server
        run: |
          node scripts/static-audit-server.mjs > /tmp/alhuma-product-description-server.log 2>&1 &
          echo $! > /tmp/alhuma-product-description-server.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alhuma-product-description-server.log
          exit 1

      - name: Run existing mobile and desktop functional smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
          SMOKE_OUTPUT_DIR: /tmp/alhuma-product-description-smoke
          SMOKE_SUMMARY_FILE: /tmp/alhuma-product-description-smoke-summary.json
        run: node scripts/run-functional-smoke.mjs

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-description-review
          path: |
            /tmp/alhuma-product-description-smoke
            /tmp/alhuma-product-description-smoke-summary.json
            /tmp/alhuma-product-description-server.log
          if-no-files-found: warn
          retention-days: 14
