name: Temporary Mixkit metadata diagnostic 2
on:
  push:
    branches: [music-library-bootstrap]
    paths: [".github/workflows/music-library-dom2.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - shell: bash
        run: |
          python3 - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True); page=await b.new_page()
              await page.goto('https://mixkit.co/free-stock-music/mood/elegant/',wait_until='domcontentloaded',timeout=60000); await page.wait_for_timeout(2000)
              a=page.locator('audio[src^="https://assets.mixkit.co/music/"]').first
              info=await a.evaluate('''el=>{let out=[];let p=el;for(let i=0;i<10&&p;i++,p=p.parentElement){out.push({i,tag:p.tagName,cls:p.className,text:(p.innerText||'').trim().slice(0,1500),html:p.outerHTML.slice(0,3000)});}return out;}''')
              print(json.dumps(info,indent=2))
              await b.close()
          asyncio.run(main())
          PY
