name: Temporary balanced Mixkit candidate collector

on:
  push:
    branches: [music-library-bootstrap]
    paths: [".github/workflows/music-library-balanced.yml"]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser/audio metadata tools
        run: |
          python3 -m pip install --quiet playwright mutagen
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Collect balanced official Mixkit tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balanced/audio
          cat > /tmp/balanced.py <<'PY'
          import asyncio,csv,json,re,urllib.request
          from pathlib import Path
          from playwright.async_api import async_playwright
          from mutagen.mp3 import MP3

          OUT=Path('balanced'); A=OUT/'audio'; A.mkdir(parents=True,exist_ok=True)
          cats=[
            ('elegant','https://mixkit.co/free-stock-music/mood/elegant/',4),
            ('house-fashion','https://mixkit.co/free-stock-music/house/',6),
            ('funk-fashion','https://mixkit.co/free-stock-music/funk/',6),
            ('edm-fashion','https://mixkit.co/free-stock-music/edm/',6),
            ('pop-lifestyle','https://mixkit.co/free-stock-music/pop/',6),
            ('ambient','https://mixkit.co/free-stock-music/ambient/',6),
            ('jazz','https://mixkit.co/free-stock-music/jazz/',6),
            ('lounge','https://mixkit.co/free-stock-music/lounge/',6),
            ('calm','https://mixkit.co/free-stock-music/mood/calm/',6),
          ]
          seen={}; order=[]
          def parse(text):
            ls=[x.strip() for x in text.splitlines() if x.strip() and x.strip()!='Download Free Music']
            title=artist=''
            for j,x in enumerate(ls):
              if x.lower().startswith('by '):
                artist=x[3:].strip(); title=ls[j-1] if j else '' ; break
            return title,artist,' | '.join(ls[:20])
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36')
              for bucket,url,cap in cats:
                page=await ctx.new_page(); await page.goto(url,wait_until='domcontentloaded',timeout=60000); await page.wait_for_timeout(1600)
                cards=page.locator('.item-grid-music-preview')
                count=await cards.count(); print(bucket,'cards',count)
                got=0
                for i in range(count):
                  if got>=cap: break
                  card=cards.nth(i); audio=card.locator('audio[src^="https://assets.mixkit.co/music/"]')
                  if await audio.count()==0: continue
                  src=await audio.first.get_attribute('src'); m=re.search(r'/music/(\d+)/(\d+)\.mp3',src or '')
                  if not m or m.group(1)!=m.group(2): continue
                  tid=m.group(1); text=await card.inner_text(); title,artist,summary=parse(text)
                  if tid not in seen:
                    seen[tid]={'source_track_id':tid,'title':title,'artist':artist,'style_buckets':[bucket],'source_pages':[url],'audio_url':src,'source_card_text':summary}; order.append(tid); got+=1
                  else:
                    if bucket not in seen[tid]['style_buckets']: seen[tid]['style_buckets'].append(bucket)
                    if url not in seen[tid]['source_pages']: seen[tid]['source_pages'].append(url)
                    # duplicates do not consume category capacity, continue finding new entries
                await page.close()
              await b.close()
          asyncio.run(main())

          headers={'User-Agent':'Mozilla/5.0 (compatible; AlHumaMusicLibrary/1.0)'}; rows=[]
          for n,tid in enumerate(order,1):
            r=seen[tid]; title=r['title'] or f'Mixkit Track {tid}'; artist=r['artist']
            safe=lambda s: re.sub(r'[^A-Za-z0-9]+','_',s).strip('_')[:80]
            fn=f"MB-{n:02d}_{safe(title)}"+(f"_{safe(artist)}" if artist else '')+'.mp3'; path=A/fn
            req=urllib.request.Request(r['audio_url'],headers=headers)
            with urllib.request.urlopen(req,timeout=60) as inp,open(path,'wb') as out:
              while True:
                z=inp.read(1024*1024)
                if not z:break
                out.write(z)
            m=MP3(path)
            r.update({'candidate_id':f'MB-{n:02d}','source':'Mixkit','file':str(path),'bytes':path.stat().st_size,'duration_sec':round(m.info.length,3),'bitrate':m.info.bitrate,'integrity_qc':'PASS' if m.info.length>=20 and path.stat().st_size>50000 else 'FAIL','style_buckets':'|'.join(r['style_buckets']),'source_pages':'|'.join(r['source_pages']),'license':'Mixkit Free License','commercial_social_use':'PASS_SOURCE_POLICY','attribution_required':'No'})
            rows.append(r); print(r['candidate_id'],tid,title,'—',artist,'—',r['style_buckets'])
          fields=sorted({k for r in rows for k in r})
          with open(OUT/'balanced_manifest.csv','w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          with open(OUT/'balanced_manifest.json','w',encoding='utf-8') as f:json.dump(rows,f,indent=2,ensure_ascii=False)
          print('TOTAL',len(rows))
          PY
          python3 /tmp/balanced.py
      - name: Upload balanced pool
        uses: actions/upload-artifact@v4
        with:
          name: alhuma-balanced-mixkit-pool
          path: balanced/
          if-no-files-found: error
          retention-days: 1
