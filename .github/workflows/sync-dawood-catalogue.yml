name: Synchronize Dawood Designers catalogue

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-dawood-catalogue.yml"
      - "scripts/sync-dawood.mjs"
      - "scripts/install-dawood-integration.mjs"
      - "scripts/seo-batch1-postprocess.mjs"
      - "scripts/generate-seo-pages-v2.mjs"
      - "scripts/performance-p1-postprocess.mjs"
      - "scripts/validate-catalogue.mjs"
      - "scripts/validate-merchant-policy.mjs"
      - "catalogue/removed-products.json"
      - "catalogue/host-canonical-policy.json"
      - "sitemap-pages.xml"
      - "404.html"
      - "policies.html"
      - "seo-pages.css"
      - "dawood-catalogue.css"
      - "dawood-catalogue.js"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-dawood-catalogue.yml"
      - "scripts/seo-batch1-postprocess.mjs"
      - "scripts/generate-seo-pages-v2.mjs"
      - "scripts/performance-p1-postprocess.mjs"
      - "scripts/validate-catalogue.mjs"
      - "scripts/validate-merchant-policy.mjs"
      - "catalogue/removed-products.json"
      - "catalogue/host-canonical-policy.json"
      - "sitemap-pages.xml"
      - "404.html"
      - "policies.html"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dawood-catalogue-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build approved catalogue data
        id: catalogue
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          node scripts/install-dawood-integration.mjs
          node scripts/sync-dawood.mjs

      - name: Normalize, optimize and generate crawlable catalogue
        id: generate
        if: always()
        run: |
          node scripts/seo-batch1-postprocess.mjs
          node scripts/generate-seo-pages-v2.mjs
          node scripts/performance-p1-postprocess.mjs
          node scripts/validate-catalogue.mjs
          node scripts/validate-merchant-policy.mjs

      - name: Publish validated catalogue update
        if: always() && steps.generate.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html assets/ catalogue/ products/ collections/ shop/ 2>/dev/null; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name "Al Huma Catalogue Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/ catalogue/ products/ collections/ shop/
          git commit -m "Update synchronized catalogue"
          git push

      - name: Report synchronization failure
        if: github.event_name != 'pull_request' && steps.catalogue.outcome == 'failure'
        run: |
          cat catalogue/sync-status.json
          echo "The cached catalogue was preserved and validated, but the supplier refresh failed."
          exit 1
