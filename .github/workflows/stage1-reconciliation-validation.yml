name: Stage 1 reconciliation validation

on:
  push:
    branches:
      - recovery/assistant-v2-stage1-main-drift-reconciliation
    paths:
      - ".github/workflows/stage1-reconciliation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reconciliation candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate and validate reconciliation candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/install-catalogue-integration.mjs
          node scripts/seo-batch1-postprocess.mjs
          node scripts/generate-seo-pages-v2.mjs
          node scripts/generate-step9b-guide.mjs
          node scripts/performance-p1-postprocess.mjs
          node scripts/performance-p2p3-postprocess.mjs
          node scripts/version-performance-assets.mjs
          test -s assets/alhuma-collection-logo.webp
          node scripts/apply-official-brand.mjs
          node scripts/image-seo-postprocess.mjs
          node scripts/entity-consistency-postprocess.mjs
          node scripts/search-ecosystem-postprocess.mjs
          node --check assistant-runtime.js
          node --check catalogue.js
          node --check commerce.js
          node --check analytics.js
          node scripts/test-product-descriptions.mjs
          node scripts/validate-catalogue.mjs
          node scripts/validate-merchant-policy.mjs
          node scripts/validate-search-ecosystem-consistency.mjs
          node scripts/validate-analytics-measurement.mjs
          rm -f \
            catalogue/analytics-measurement-report.json \
            catalogue/search-ecosystem-consistency-report.json \
            catalogue/seo-generation-report.json \
            catalogue/source-integrity-report.json \
            catalogue/validation-report.json
          node scripts/validate-public-catalogue-safety.mjs
          git diff --check

      - name: Verify confidentiality boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'dawooddesigners\.com|"sourcePrice"[[:space:]]*:|"markup"[[:space:]]*:|"sourceUrl"[[:space:]]*:|"sourceCollection(Handle)?"[[:space:]]*:|"sourceBrand"[[:space:]]*:|"authorization"[[:space:]]*:|catalogue/dawood-products\.json|dawood-catalogue\.js|dawood-commerce\.js' \
            --exclude-dir=.git \
            --exclude='stage1-reconciliation-validation.yml' \
            .; then
            echo "Confidentiality boundary violation detected." >&2
            exit 1
          fi

      - name: Package generated reconciliation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRTUXB HEAD > /tmp/changed-files.txt
          git ls-files --others --exclude-standard >> /tmp/changed-files.txt
          sort -u /tmp/changed-files.txt -o /tmp/changed-files.txt
          git diff --name-only --diff-filter=D HEAD > /tmp/deleted-files.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "CHANGED_COUNT=$(wc -l < /tmp/changed-files.txt)"
            echo "DELETED_COUNT=$(wc -l < /tmp/deleted-files.txt)"
            echo
            echo "[changed]"
            cat /tmp/changed-files.txt
            echo
            echo "[deleted]"
            cat /tmp/deleted-files.txt
            echo
            echo "[stat]"
            git diff --stat HEAD
          } > reconciliation-manifest.txt
          cp /tmp/deleted-files.txt reconciliation-deleted-files.txt
          tar -czf reconciliation-output.tar.gz -T /tmp/changed-files.txt

      - name: Upload reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage1-reconciliation-output
          path: |
            reconciliation-output.tar.gz
            reconciliation-manifest.txt
            reconciliation-deleted-files.txt
          if-no-files-found: error
          retention-days: 1
