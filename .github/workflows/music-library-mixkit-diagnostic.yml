name: Temporary Mixkit DOM diagnostic

on:
  push:
    branches: [music-library-bootstrap]
    paths: [".github/workflows/music-library-mixkit-diagnostic.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null
      - shell: bash
        run: |
          python3 - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              page=await b.new_page(accept_downloads=True)
              await page.goto('https://mixkit.co/free-stock-music/mood/elegant/',wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(2500)
              loc=page.get_by_text('Download Free Music',exact=True)
              print('COUNT',await loc.count())
              for i in range(min(await loc.count(),4)):
                x=loc.nth(i)
                print('---BUTTON',i,'---')
                try: print('TAG',await x.evaluate('el=>el.tagName'))
                except Exception as e: print('tag err',e)
                try: print('OUTER', (await x.evaluate('el=>el.outerHTML'))[:4000])
                except Exception as e: print('outer err',e)
                try: print('PARENT', (await x.evaluate('el=>el.parentElement.outerHTML'))[:8000])
                except Exception as e: print('parent err',e)
              print('AUDIOS',await page.locator('audio').count())
              for i in range(min(await page.locator('audio').count(),10)):
                a=page.locator('audio').nth(i)
                print('AUDIO',i,await a.get_attribute('src'))
              entries=await page.evaluate("performance.getEntriesByType('resource').map(x=>x.name).filter(x=>x.includes('mixkit')||x.includes('.mp3'))")
              print('RESOURCES',json.dumps(entries[-100:],indent=2))
              await b.close()
          asyncio.run(main())
          PY
